name: DevSecOps ML Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write # Required for AWS OIDC connection
  contents: read

jobs:
  build-train-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Compile-Time Training & Automated Build-Gating
      run: |
        # In a real environment, KMS fetches the seed securely here.
        # We pass dummy env vars so the CI succeeds during demonstration.
        export AWS_DEFAULT_REGION=ap-southeast-2
        python src/train.py

    - name: Upload Verified Model Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: verified-dnn-model
        path: models/verified_watermarked_model.pth

    - name: Deploy to AWS S3 (Production Release)
      if: success()
      run: |
        # Replace BUCKET_NAME with the output from terraform
        # Extract bucket name dynamically if possible, or we will just use wildcard for now.
        aws s3 cp models/verified_watermarked_model.pth s3://$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'sit723-verified-models-')].Name" --output text | head -n 1)/
        echo "Deployment Successful!"
